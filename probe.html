<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>sync backend probe</title>
<style>body{font:13px/1.5 ui-monospace,monospace;padding:14px;white-space:pre-wrap}pre{white-space:pre-wrap}</style>
</head><body>
<h3>sync backend probe</h3>
<pre id="out">running…</pre>
<script>
var out = document.getElementById("out");
var lines = [];
function log(s){ lines.push(s); out.textContent = lines.join("\n"); }
function step(name, fn){ return fn().then(function(v){ log("OK   " + name + " :: " + JSON.stringify(v).slice(0,300)); return v; },
  function(e){ log("FAIL " + name + " :: " + (e && e.message ? e.message : e)); return null; }); }
function j(r){ return r.text().then(function(t){ return {status:r.status, ct:r.headers.get("content-type"), body:t.slice(0,240)}; }); }

function probeJsonBlob(){
  var id = null, url = null;
  return step("jsonblob.POST", function(){
    return fetch("https://jsonblob.com/api/jsonBlob", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({probe:1, stamp:Date.now()})}).then(function(r){
        id = (r.headers.get("Location")||"").split("/").pop();
        url = "https://jsonblob.com/api/jsonBlob/" + id;
        return {status:r.status, id:id};
      });
  }).then(function(){
    if(!id) return;
    return step("jsonblob.GET", function(){ return fetch(url, {cache:"no-store"}).then(j); });
  }).then(function(){
    if(!id) return;
    return step("jsonblob.PUT", function(){
      return fetch(url, {method:"PUT", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({probe:1, stamp:"second-"+Date.now()})}).then(j);
    });
  }).then(function(){
    if(!id) return;
    return step("jsonblob.GET.afterPut", function(){ return fetch(url + "?x=" + Date.now(), {cache:"no-store"}).then(j); });
  });
}

function probeExtends(){
  var id = null, base = "https://extendsclass.com/api/json-storage/bin/";
  return step("extends.POST", function(){
    return fetch("https://extendsclass.com/api/json-storage/bin", {method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({probe:1, stamp:Date.now()})}).then(function(r){
        return r.text().then(function(t){
          var m = t.match(/"id"\s*:\s*"([^"]+)"/); id = m && m[1];
          return {status:r.status, id:id, head:t.slice(0,80)};
        });
      });
  }).then(function(){
    if(!id) return;
    return step("extends.PUT", function(){
      return fetch(base + id, {method:"PUT", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({probe:2, stamp:"second-"+Date.now()})}).then(function(r){
          return r.text().then(function(t){ return {status:r.status, head:t.slice(0,80)}; });
        });
    });
  }).then(function(){
    if(!id) return;
    return step("extends.GET.plain", function(){ return fetch(base + id, {cache:"no-store"}).then(j); });
  }).then(function(){
    if(!id) return;
    return step("extends.GET.bust", function(){ return fetch(base + id + "?t=" + Date.now(), {cache:"no-store"}).then(j); });
  }).then(function(){
    if(!id) return;
    return step("extends.GET.bust2", function(){ return fetch(base + id + "?t=" + Date.now(), {cache:"no-store"}).then(j); });
  });
}

function probeKV(){
  var app = null;
  return step("immanuel.appkey", function(){
    return fetch("https://keyvalue.immanuel.co/api/KeyVal/GetAppKey", {method:"POST"}).then(function(r){
      return r.text().then(function(t){ app = t.replace(/"/g,""); return {status:r.status, key:app}; });
    });
  }).then(function(){
    if(!app) return;
    return step("immanuel.set", function(){
      return fetch("https://keyvalue.immanuel.co/api/KeyVal/UpdateValue/" + app + "/probe/" + encodeURIComponent("value-" + Date.now()),
        {method:"POST"}).then(j);
    });
  }).then(function(){
    if(!app) return;
    return step("immanuel.get", function(){
      return fetch("https://keyvalue.immanuel.co/api/KeyVal/GetValue/" + app + "/probe").then(j);
    });
  });
}

log("origin=" + location.origin + " ua=" + navigator.userAgent.slice(0,60));
probeJsonBlob().then(probeExtends).then(probeKV).then(function(){ log("--- done ---"); });
</script>
</body></html>
